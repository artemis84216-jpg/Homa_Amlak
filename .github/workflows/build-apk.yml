name: Build Flutter APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.0'
          channel: 'stable'
          cache: true
      
      - name: Create android folder
        run: flutter create . --platforms android --project-name homa_amlak
      
      - name: Fix Android SDK, Kotlin and Permissions
        run: |
          # ۱. اصلاح نسخه Kotlin در settings.gradle (ساختار جدید فلاتر ۳.۱۹+)
          perl -pi -e 's/id "org\.jetbrains\.kotlin\.android" version ".*"/id "org.jetbrains.kotlin.android" version "1.9.24"/g' android/settings.gradle
          
          # ۲. اصلاح نسخه Kotlin در build.gradle (ساختار قدیمی - جهت اطمینان)
          perl -pi -e 's/ext\.kotlin_version\s*=\s*".*"/ext.kotlin_version = "1.9.24"/g' android/build.gradle
          
          # ۳. تغییر compileSdk به ۳۵ برای سازگاری با image_picker
          perl -pi -e 's/compileSdk\s+flutter\.compileSdkVersion/compileSdk 35/g' android/app/build.gradle
          perl -pi -e 's/compileSdkVersion\s+flutter\.compileSdkVersion/compileSdkVersion 35/g' android/app/build.gradle
          
          # ۴. اضافه کردن مجوزهای دوربین و گالری
          perl -pi -e 's/<\/manifest>/    <uses-permission android:name="android.permission.CAMERA"\/>\n    <uses-permission android:name="android.permission.READ_MEDIA_IMAGES"\/>\n<\/manifest>/g' android/app/src/main/AndroidManifest.xml

      - name: Install dependencies
        run: flutter pub get
      
      - name: Build APK
        run: flutter build apk --release
      
      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: release-apk
          path: build/app/outputs/flutter-apk/app-release.apk
