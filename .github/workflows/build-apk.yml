name: Build Flutter APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.0'
          channel: 'stable'
          cache: true
      
      - name: Create android folder
        run: flutter create . --platforms android --project-name homa_amlak
      
      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        
      - name: Fix Android Configurations
        run: |
          # ۱. جایگزینی قوی و ساده برای تغییر compileSdk به ۳۵ (هر چیزی بعد از compileSdk باشد را عوض می‌کند)
          sed -i 's/compileSdk.*/compileSdk 35/' android/app/build.gradle
          
          # ۲. تغییر نسخه Kotlin به 1.9.24
          sed -i 's/org\.jetbrains\.kotlin\.android" version ".*"/org.jetbrains.kotlin.android" version "1.9.24"/' android/settings.gradle
          sed -i "s/ext\.kotlin_version.*/ext.kotlin_version = '1.9.24'/" android/build.gradle
          
          # ۳. اضافه کردن مجوزهای دوربین و گالری
          sed -i '/<\/manifest>/i \    <uses-permission android:name="android.permission.CAMERA"/>\n    <uses-permission android:name="android.permission.READ_MEDIA_IMAGES"/>' android/app/src/main/AndroidManifest.xml

      - name: Install Android SDK 35 Platform
        run: |
          yes | sdkmanager --licenses
          sdkmanager "platforms;android-35"

      - name: Install dependencies
        run: flutter pub get
      
      - name: Build APK
        run: flutter build apk --release
      
      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: release-apk
          path: build/app/outputs/flutter-apk/app-release.apk
